# Automation: publish the EV Trip Planner plan to evcc as a vehicle charging
# plan, and manage the car's own charge limit (evcc reads it but will not
# raise it).
#
# Paste into Settings > Automations > (new) > Edit in YAML.
# Replace <car> with your Tesla Fleet entity slug, <evcc_vehicle> with the
# vehicle name in evcc.yaml, and the fallback notify service with your phone.
#
# Needs: rest_command.yaml and input_boolean.evcc_car_limit_raised (see README).
#
# The plan comes from sensor.ev_trip_planner_plan: state is the SOC, attributes
# kind (trip, floor, idle), deadline and notify_service. A state trigger
# without `to` also fires on attribute changes, so a moved deadline at the
# same SOC still publishes.
#
# Charge limit policy: 80% is the default. Above 80% only while a trip needs
# it. The limit comes back down once something positively says it is no
# longer needed (HA raised it and the trip is gone, a charge actually reached
# it, or a booked trip needs no more than 80%). A floor plan is not a booked
# trip, so a limit set by hand holds until the charge that used it is done.
# Never lowered while charging. Every limit write is read back from the car
# before it is recorded.
#
# Limit writes: the car is woken first and a write is tried up to three
# times. When evcc contacts the car (it does after every plan change, and
# polls it while connected), the car drops Home Assistant's signed command
# session; the next command then fails with "Vehicle did not recognize the
# key" and the one after that works. Seen 8 Oct 2026. The limit is also
# written before the plan goes to evcc, so this run's own publish does not
# get in between.

alias: evcc publish trip plan
description: >-
  Push the EV Trip Planner plan (trip or SOC floor) to evcc as a vehicle plan.
  Raise the car charge limit for trips needing more than the normal limit and
  restore it afterwards. Never lowers mid-charge.
mode: restart
triggers:
  - trigger: state
    id: trip
    entity_id: sensor.ev_trip_planner_plan
    not_from: [unavailable, unknown]
    not_to: [unavailable, unknown]
  - trigger: homeassistant
    id: startup
    event: start
  - trigger: time_pattern
    id: hourly
    hours: "/1"
  - trigger: state
    id: charge_ended
    entity_id: sensor.<car>_charging
    from: "charging"
    not_to: [unavailable, unknown]
actions:
  - delay: "00:00:10"
  - variables:
      vehicle: <evcc_vehicle>
      car_limit_entity: number.<car>_charge_limit
      car_wake_button: button.<car>_wake
      normal_limit: 80
      car_limit: "{{ states('number.<car>_charge_limit') | float(0) }}"
      car_soc: "{{ states('sensor.<car>_battery_level') | float(0) }}"
      charging_state: "{{ states('sensor.<car>_charging') }}"
      fired_by: "{{ (trigger | default({})).get('id') or 'manual' }}"
      plan_entity: sensor.ev_trip_planner_plan
      plan_kind: "{{ state_attr(plan_entity, 'kind') }}"
      soc_raw: "{{ states(plan_entity) | float(0) }}"
      soc: "{{ [soc_raw | round(0, 'ceil') | int, 100] | min }}"
      deadline_ts: "{{ as_timestamp(state_attr(plan_entity, 'deadline'), 0) }}"
      now_ts: "{{ as_timestamp(now()) }}"
      idle: "{{ plan_kind in [None, 'idle'] or soc_raw <= 0 }}"
      booked_trip: "{{ not idle and plan_kind == 'trip' }}"
      plan_ts: "{{ [deadline_ts, now_ts + 900] | max }}"
      plan_time: "{{ plan_ts | timestamp_custom('%Y-%m-%dT%H:%M:%SZ', false) }}"
      raise_needed: "{{ not idle and soc > normal_limit }}"
      notify_raw: "{{ state_attr(plan_entity, 'notify_service') or '' }}"
      notify_service: >-
        {{ notify_raw if notify_raw.startswith('notify.')
           else 'notify.mobile_app_<your_phone>' }}
  - alias: Car charge limit
    choose:
      - alias: Raise for an upcoming trip
        conditions: "{{ raise_needed and car_limit < soc }}"
        sequence:
          - alias: Wake the car, the limit read above may be stale
            action: button.press
            target:
              entity_id: "{{ car_wake_button }}"
            continue_on_error: true
          - delay: "00:00:20"
          - variables:
              limit_awake: "{{ states(car_limit_entity) | float(0) }}"
          - alias: Write until the car confirms, at most three tries
            repeat:
              while:
                - condition: template
                  value_template: >-
                    {{ states(car_limit_entity) | float(0) < soc
                       and repeat.index <= 3 }}
              sequence:
                - action: number.set_value
                  target:
                    entity_id: "{{ car_limit_entity }}"
                  data:
                    value: "{{ soc }}"
                  continue_on_error: true
                - wait_template: "{{ states(car_limit_entity) | float(0) >= soc }}"
                  timeout: "00:00:15"
                  continue_on_timeout: true
          - if:
              - condition: template
                value_template: "{{ states(car_limit_entity) | float(0) >= soc }}"
            then:
              - action: persistent_notification.dismiss
                data:
                  notification_id: evcc_car_limit
              - alias: >-
                  Record and announce only a raise HA made. A limit already high
                  enough once the car woke (set by hand) stays a human's.
                if:
                  - condition: template
                    value_template: "{{ limit_awake < soc }}"
                  - condition: state
                    entity_id: input_boolean.evcc_car_limit_raised
                    state: "off"
                then:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.evcc_car_limit_raised
                  - action: "{{ notify_service }}"
                    data:
                      title: Tesla charge limit raised
                      message: >-
                        Your next trip needs {{ soc }}%, so the charge limit is raised
                        until then. It goes back to {{ normal_limit }}% afterwards.
                    continue_on_error: true
            else:
              - action: persistent_notification.create
                data:
                  notification_id: evcc_car_limit
                  title: Tesla charge limit not raised
                  message: >-
                    Could not raise the charge limit to {{ soc }}% (car asleep or
                    unreachable). Retrying hourly.
      - alias: Lower to the normal limit
        conditions:
          - alias: It is actually above normal, and no trip needs it
            condition: template
            value_template: "{{ not raise_needed and car_limit > normal_limit }}"
          - alias: Never interrupt a charge in progress
            condition: template
            value_template: "{{ charging_state != 'charging' }}"
          - alias: >-
              Something must positively say the high limit is not needed. A
              floor plan is not a booked trip.
            condition: template
            value_template: >-
              {{ is_state('input_boolean.evcc_car_limit_raised', 'on')
                 or (fired_by == 'charge_ended' and car_soc >= car_limit - 1)
                 or (booked_trip and soc <= normal_limit) }}
        sequence:
          - action: button.press
            target:
              entity_id: "{{ car_wake_button }}"
            continue_on_error: true
          - delay: "00:00:20"
          - alias: Write until the car confirms, at most three tries
            repeat:
              while:
                - condition: template
                  value_template: >-
                    {{ states(car_limit_entity) | float(999) > normal_limit
                       and repeat.index <= 3 }}
              sequence:
                - action: number.set_value
                  target:
                    entity_id: "{{ car_limit_entity }}"
                  data:
                    value: "{{ normal_limit }}"
                  continue_on_error: true
                - wait_template: "{{ states(car_limit_entity) | float(999) <= normal_limit }}"
                  timeout: "00:00:15"
                  continue_on_timeout: true
          - if:
              - condition: template
                value_template: "{{ states(car_limit_entity) | float(999) <= normal_limit }}"
            then:
              - alias: Only tell them if a human raised it, not if we did
                if:
                  - condition: state
                    entity_id: input_boolean.evcc_car_limit_raised
                    state: "off"
                then:
                  - action: "{{ notify_service }}"
                    data:
                      title: Tesla charge limit reset
                      message: >-
                        The limit was {{ car_limit | round(0) | int }}% with nothing
                        needing more than {{ normal_limit }}%, so it is back to
                        {{ normal_limit }}%.
                    continue_on_error: true
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.evcc_car_limit_raised
              - action: persistent_notification.dismiss
                data:
                  notification_id: evcc_car_limit
            else:
              - action: persistent_notification.create
                data:
                  notification_id: evcc_car_limit
                  title: Tesla charge limit not restored
                  message: >-
                    Could not lower the charge limit to {{ normal_limit }}% (car
                    asleep or unreachable). Retrying hourly.
  - alias: Publish or clear evcc plan
    choose:
      - conditions: "{{ idle }}"
        sequence:
          - action: rest_command.evcc_delete_soc_plan
            data:
              vehicle: "{{ vehicle }}"
            response_variable: resp
            continue_on_error: true
    default:
      - action: rest_command.evcc_set_soc_plan
        data:
          vehicle: "{{ vehicle }}"
          soc: "{{ soc }}"
          time: "{{ plan_time }}"
        response_variable: resp
        continue_on_error: true
  - if:
      - condition: template
        value_template: "{{ resp is not defined or resp.status >= 300 }}"
    then:
      - action: persistent_notification.create
        data:
          notification_id: evcc_plan_publish
          title: evcc plan not updated
          message: >-
            Could not {{ 'clear' if idle else 'set' }} the charging plan in evcc
            ({{ resp.status if resp is defined else 'no response' }}).
